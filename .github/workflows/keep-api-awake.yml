# Render's free tier puts the API to sleep after 15 idle minutes, and waking it takes 30 to 60 seconds.
# Opening the health page every 5 minutes helps keep it awake. GitHub often runs schedules late or skips them,
# so this is only a backup: the reliable keep-alive is an external monitor (README section 0.3).
# One always-on free service uses about 730 of Render's 750 free hours a month.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 https://sagemaker-api.onrender.com/api/health
